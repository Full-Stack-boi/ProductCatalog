name: product_catalog
description: "Product Catalog Application with MVVM, Riverpod, and Dio"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.1.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
